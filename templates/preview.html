<!DOCTYPE html>
<html>

<head>
    <title>{{ resume.full_name }} - CV Preview</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="cv">

        <!-- HEADER -->
        <h1>{{ resume.full_name }}</h1>

        <p style="color:#9ca3af; margin-bottom:10px;">
            {{ resume.bio }}
        </p>

        <div style="margin-bottom:20px; color:#9ca3af;">
            <span>{{ resume.email }}</span> |
            <span>{{ resume.phone }}</span> |
            <span>{{ resume.location }}</span>
        </div>

        <!-- SECTIONS -->
        <div class="section">
            <h2>About</h2>
            <p>{{ resume.bio }}</p>
        </div>

        <div class="section">
            <h2>Education</h2>
            <p>{{ resume.education }}</p>
        </div>

        <div class="section">
            <h2>Skills</h2>
            <p>{{ resume.skills }}</p>
        </div>

        <div class="section">
            <h2>Projects</h2>
            <p>{{ resume.projects }}</p>
        </div>

        <!-- LINKS -->
        <div class="section">
            <h2>Links</h2>

            <p>
                GitHub:
                <a href="{{ resume.github }}" target="_blank">
                    {{ resume.github }}
                </a>
            </p>

            <p>
                LinkedIn:
                <a href="{{ resume.linkedin }}" target="_blank">
                    {{ resume.linkedin }}
                </a>
            </p>
        </div>

        <!-- ACTIONS -->
        <div style="margin-top:30px; display:flex; gap:10px;">

            <a href="/download/{{ resume.id }}">
                <button>Download PDF</button>
            </a>

            <a href="/@{{ resume.username }}">
                <button>View Portfolio</button>
            </a>

        </div>

    </div>

</body>

</html>
